# funNLP-toolkit Configuration

# Data paths
# 词典目录的缺省值（相对本仓库推断同级 checkout 的 funNLP/data）。
# 优先级：CLI 参数 --data-dir > 环境变量 FUNNLP_DATA_DIR > 此缺省值。
# 没 checkout funNLP 时，设环境变量或传 --data-dir 指向自己的词典目录即可，
# 不必改动本文件。
data_dir: "../../funNLP/data"

# Dictionary settings
dictionaries:
  encoding: "utf-8"
  cache_enabled: true
  cache_dir: ".cache"

# Search settings
search:
  max_results: 20
  min_score: 3

# Output settings
output:
  format: "text"  # text, json, markdown
  encoding: "utf-8"
